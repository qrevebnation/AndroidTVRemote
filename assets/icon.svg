<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Catppuccin Mantle to Crust) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>

    <!-- TV Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>

    <!-- TV Screen Highlight -->
    <linearGradient id="tvGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b4befe" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Remote Gradient (Catppuccin Mauve to Lavender) -->
    <linearGradient id="remoteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a283e"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>

    <!-- Mauve Accent -->
    <linearGradient id="mauveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#b4befe"/>
    </linearGradient>

    <!-- Signal Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Squircle Base (GNOME / macOS style) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#313244" stroke-width="4"/>

  <!-- TV Frame -->
  <rect x="76" y="96" width="360" height="230" rx="20" fill="url(#screenGrad)" stroke="#45475a" stroke-width="8"/>
  <rect x="88" y="108" width="336" height="206" rx="14" fill="#11111b"/>
  <rect x="88" y="108" width="336" height="103" rx="14" fill="url(#tvGlass)"/>

  <!-- TV Stand Base -->
  <path d="M 206 326 L 186 360 L 326 360 L 306 326 Z" fill="#313244"/>
  <rect x="166" y="360" width="180" height="10" rx="5" fill="#45475a"/>

  <!-- Signal / Broadcast Waves (Green / Cyan) -->
  <path d="M 196 160 A 64 64 0 0 1 316 160" fill="none" stroke="#a6e3a1" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  <path d="M 216 180 A 40 40 0 0 1 296 180" fill="none" stroke="#a6e3a1" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
  <circle cx="256" cy="195" r="5" fill="#a6e3a1" filter="url(#glow)"/>

  <!-- Handheld Remote Controller Overlay (Bottom Right Angle) -->
  <g transform="translate(240, 210) rotate(-12, 100, 140)">
    <!-- Remote Shadow -->
    <rect x="42" y="24" width="128" height="252" rx="36" fill="#000000" opacity="0.5" filter="url(#glow)"/>
    <!-- Remote Body -->
    <rect x="40" y="20" width="128" height="250" rx="34" fill="url(#remoteGrad)" stroke="#cba6f7" stroke-width="5"/>
    
    <!-- Top Power Dot -->
    <circle cx="72" cy="52" r="8" fill="#f38ba8"/>
    <rect x="104" y="46" width="32" height="12" rx="6" fill="#45475a"/>

    <!-- D-Pad Wheel -->
    <circle cx="104" cy="122" r="44" fill="#181825" stroke="#313244" stroke-width="3"/>
    <circle cx="104" cy="122" r="18" fill="url(#mauveGrad)"/>
    
    <!-- D-Pad Arrows -->
    <polygon points="104,86 100,94 108,94" fill="#cdd6f4"/>
    <polygon points="104,158 100,150 108,150" fill="#cdd6f4"/>
    <polygon points="68,122 76,118 76,126" fill="#cdd6f4"/>
    <polygon points="140,122 132,118 132,126" fill="#cdd6f4"/>

    <!-- Nav Buttons -->
    <circle cx="74" cy="190" r="11" fill="#313244"/>
    <circle cx="104" cy="190" r="11" fill="#89b4fa"/>
    <circle cx="134" cy="190" r="11" fill="#313244"/>

    <rect x="66" y="218" width="32" height="18" rx="9" fill="#313244"/>
    <rect x="110" y="218" width="32" height="18" rx="9" fill="#313244"/>
  </g>
</svg>
