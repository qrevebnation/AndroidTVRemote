[package]
name = "atv-remote"
version = "0.1.0"
edition = "2021"
authors = ["mnrrochman"]
description = "High-performance, low-memory cross-platform Google TV remote in pure Rust"

[dependencies]
tokio = { version = "1.41", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.10"
rustls-pemfile = "2.2"
rcgen = { version = "0.13", features = ["pem", "ring"] }
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
hex = "0.4"
bytes = "1.9"
prost = "0.13"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = "1.9"
mdns-sd = "0.13"

[build-dependencies]
prost-build = "0.13"
slint-build = "1.9"

[dev-dependencies]
tokio = { version = "1.41", features = ["full"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
